<div class="card">
  <h3 class="card__name">Name: {{ menu.name }}</h3>

  <ul class="card__list">
    <p>ID: {{ menu.id }}</p>
    Dishes : @for (dish of menu.dishes; track $index) {
    <li class="card__list-item">
      {{ dish.name }} - {{ dish.price | currency : "USD" : "symbol" : "1.2-2" }}
    </li>
    }
  </ul>

  <lib-btns-actions
    (editAction)="editMenu()"
    (deleteAction)="openModal()"
  ></lib-btns-actions>

  @if (isModalOpen) {
  <lib-confirm-modal
    [title]="'Confirm Deletion'"
    [message]="'Are you sure you want to delete this dish?'"
    (confirm)="confirmDelete()"
    (cancel)="closeModal()"
  ></lib-confirm-modal>
  }
</div>
